# sops creation rules for evattlabs-infra/secrets/.
# One recipient: the workstation age key, present on both trantor and terminus.
# Rotate with: `sops updatekeys secrets/*.enc.yaml`

keys:
  - &terminus age1n36mcwf7tpl55aypqzukgjuwcpmpytl6ydkjxtuxx9p53yv9hcgqp6dhke

creation_rules:
  - path_regex: secrets/.*\.(yaml|json|env|ini)$
    key_groups:
      - age:
          - *terminus
