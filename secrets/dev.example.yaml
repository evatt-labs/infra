# Local-dev tofu variables for evattlabs-infra.
#
# Workflow:
#   1. cp dev.example.yaml dev.enc.yaml
#   2. sops --encrypt --in-place dev.enc.yaml
#   3. sops dev.enc.yaml      # populate values
#   4. git add dev.enc.yaml && git commit
#
# Loaded by direnv from this repo's .envrc.

# === Cloudflare (for evattlabs-infra/dns/) ===
# Account API token, scoped to: DNS:Edit on evattlabs.com zone, Zone:Read
TF_VAR_cloudflare_api_token: ""
TF_VAR_cloudflare_account_id: "0eff878f6bcf777a3e51e2c1c01ca0a4"

# === Namecheap (for evattlabs-infra/registrar/) ===
# Profile → Manage Profile → Tools → API Access → Enable + add IP allowlist.
# user_name and api_user are typically the same (the Namecheap username).
# client_ip = your CURRENT public IP (re-update this when your IP changes,
# OR delegate from a static IP if running CI from self-hosted runner).
TF_VAR_namecheap_user_name: "jmevatt"
TF_VAR_namecheap_api_user: "jmevatt"
TF_VAR_namecheap_api_key: ""
TF_VAR_namecheap_client_ip: ""
